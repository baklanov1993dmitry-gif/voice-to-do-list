<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1b19">
<title>Дневник задач</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --accent: #d85a30;
    --on-accent: #4a1b0c;
  }
  [data-theme="dark"] {
    --bg: #1c1b19;
    --surface: #2c2c2a;
    --surface-2: #242422;
    --border: #3a3934;
    --text-primary: #f1efe8;
    --text-secondary: #b4b2a9;
    --text-muted: #5f5e5a;
  }
  [data-theme="light"] {
    --bg: #faf9f6;
    --surface: #ffffff;
    --surface-2: #f2f0ea;
    --border: #e3e1d9;
    --text-primary: #1f1e1c;
    --text-secondary: #5f5e5a;
    --text-muted: #9c9a92;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text-primary);
    font-family: -apple-system, Roboto, "Segoe UI", system-ui, sans-serif;
  }
  body {
    display: flex; flex-direction: column;
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
    min-height: 100vh;
  }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .header h1 { font-size: 15px; font-weight: 500; margin: 0; }
  .icon-btn {
    background: none; border: none; color: var(--text-muted); padding: 6px;
    cursor: pointer; display: flex; align-items: center; border-radius: 8px;
  }
  .icon-btn:active { background: var(--surface); }
  .icon-btn svg { width: 20px; height: 20px; }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .stat-card { background: var(--surface); border-radius: 12px; padding: 10px 12px; }
  .stat-label { font-size: 12px; color: var(--text-secondary); margin: 0 0 2px; }
  .stat-value { font-size: 18px; font-weight: 500; margin: 0; }

  textarea {
    width: 100%; flex: 1; min-height: 140px; font-size: 17px; line-height: 1.5;
    padding: 14px; border: 1px solid var(--border); border-radius: 16px; resize: none;
    outline: none; background: transparent; color: var(--text-primary);
    margin-bottom: 12px; font-family: inherit;
  }
  textarea::placeholder { color: var(--text-muted); }
  textarea:focus { border-color: var(--accent); }

  button.primary {
    width: 100%; font-size: 16px; font-weight: 500; padding: 16px; border: none;
    border-radius: 12px; cursor: pointer; background: var(--accent); color: var(--on-accent);
    margin-bottom: 16px;
  }
  button.primary:disabled { opacity: 0.6; }
  button.primary:active { transform: scale(0.98); }

  #status { font-size: 14px; min-height: 20px; margin-bottom: 12px; color: var(--text-secondary); }

  .last-label { font-size: 12px; color: var(--text-secondary); margin: 0 0 8px; }
  .last-entry { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--border); }
  .badge { background: var(--surface-2); color: var(--accent); font-size: 11px; padding: 2px 8px; border-radius: 8px; white-space: nowrap; }
  .last-desc { font-size: 13px; color: var(--text-secondary); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .last-hours { font-size: 12px; color: var(--text-muted); white-space: nowrap; }

  .hint { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 8px; }

  /* Панель настроек */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: none; align-items: flex-end; justify-content: center; z-index: 10;
  }
  .overlay.open { display: flex; }
  .sheet {
    background: var(--bg); width: 100%; max-width: 480px; border-radius: 20px 20px 0 0;
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
    border: 1px solid var(--border); border-bottom: none;
  }
  .sheet h2 { font-size: 15px; font-weight: 500; margin: 0 0 16px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-top: 1px solid var(--border); }
  .row:first-of-type { border-top: none; }
  .row-label { font-size: 14px; color: var(--text-primary); }
  .theme-switch { display: flex; gap: 8px; }
  .theme-opt {
    width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent;
    cursor: pointer; padding: 0;
  }
  .theme-opt.dark-preview { background: #1c1b19; }
  .theme-opt.light-preview { background: #faf9f6; border-color: #e3e1d9; }
  .theme-opt.active { border-color: var(--accent); }
  input[type="color"] {
    width: 40px; height: 32px; border: none; border-radius: 8px; padding: 0; background: none; cursor: pointer;
  }
  .sheet-close {
    width: 100%; padding: 14px; margin-top: 16px; border: 1px solid var(--border);
    border-radius: 12px; background: none; color: var(--text-primary); font-size: 15px; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="header">
    <h1>Дневник задач</h1>
    <button class="icon-btn" id="settingsBtn" aria-label="Настройки">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>

  <div class="stats">
    <div class="stat-card">
      <p class="stat-label">Сегодня</p>
      <p class="stat-value" id="statHours">—</p>
    </div>
    <div class="stat-card">
      <p class="stat-label">Записей</p>
      <p class="stat-value" id="statCount">—</p>
    </div>
  </div>

  <textarea id="txt" placeholder="Например: 2 часа доработка отчёта по клиенту X"></textarea>
  <button class="primary" id="saveBtn">Записать</button>
  <div id="status"></div>

  <p class="last-label" id="lastLabel">Последнее</p>
  <div class="last-entry" id="lastEntry">
    <span class="last-desc" style="color: var(--text-muted);">Пока нет записей</span>
  </div>

  <p class="hint">Тап по полю, микрофон на клавиатуре, диктуй</p>

  <div class="overlay" id="overlay">
    <div class="sheet">
      <h2>Настройки</h2>
      <div class="row">
        <span class="row-label">Тема</span>
        <div class="theme-switch">
          <button class="theme-opt dark-preview" id="themeDark" aria-label="Тёмная тема"></button>
          <button class="theme-opt light-preview" id="themeLight" aria-label="Светлая тема"></button>
        </div>
      </div>
      <div class="row">
        <span class="row-label">Акцентный цвет</span>
        <input type="color" id="accentPicker" value="#d85a30">
      </div>
      <button class="sheet-close" id="closeSettings">Готово</button>
    </div>
  </div>

<script>
  // ==== Настрой этот адрес после развёртывания Apps Script (см. инструкцию) ====
  const API_URL = 'https://script.google.com/macros/s/AKfycbx0VwoUrP5IjYbEVOAOAHoQTmOs-z4EkK1aQGRpT3LWTkfSoTliDM82_8yH3ujX9K_btQ/exec';

  const txt = document.getElementById('txt');
  const saveBtn = document.getElementById('saveBtn');
  const statusEl = document.getElementById('status');
  const statHours = document.getElementById('statHours');
  const statCount = document.getElementById('statCount');
  const lastEntry = document.getElementById('lastEntry');
  const lastLabel = document.getElementById('lastLabel');

  window.addEventListener('load', () => { try { txt.focus(); } catch (e) {} });

  /* ---------- Тема и акцентный цвет ---------- */
  const root = document.documentElement;

  function applyAccent(hex) {
    root.style.setProperty('--accent', hex);
    root.style.setProperty('--on-accent', contrastColor(hex));
  }
  function contrastColor(hex) {
    const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return luminance > 0.6 ? '#1f1e1c' : '#ffffff';
  }

  const savedTheme = localStorage.getItem('theme') || 'dark';
  const savedAccent = localStorage.getItem('accent') || '#d85a30';
  root.setAttribute('data-theme', savedTheme);
  applyAccent(savedAccent);
  document.getElementById('accentPicker').value = savedAccent;
  updateThemeButtons(savedTheme);

  function updateThemeButtons(theme) {
    document.getElementById('themeDark').classList.toggle('active', theme === 'dark');
    document.getElementById('themeLight').classList.toggle('active', theme === 'light');
  }
  document.getElementById('themeDark').addEventListener('click', () => {
    root.setAttribute('data-theme', 'dark'); localStorage.setItem('theme', 'dark'); updateThemeButtons('dark');
  });
  document.getElementById('themeLight').addEventListener('click', () => {
    root.setAttribute('data-theme', 'light'); localStorage.setItem('theme', 'light'); updateThemeButtons('light');
  });
  document.getElementById('accentPicker').addEventListener('input', (e) => {
    applyAccent(e.target.value); localStorage.setItem('accent', e.target.value);
  });

  /* ---------- Панель настроек ---------- */
  const overlay = document.getElementById('overlay');
  document.getElementById('settingsBtn').addEventListener('click', () => overlay.classList.add('open'));
  document.getElementById('closeSettings').addEventListener('click', () => overlay.classList.remove('open'));
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('open'); });

  /* ---------- Статистика и последняя запись ---------- */
  function loadStats() {
    if (API_URL.indexOf('ВСТАВЬ_СЮДА') !== -1) return; // ещё не настроено
    fetch(API_URL + '?action=stats')
      .then((r) => r.json())
      .then((data) => {
        statHours.textContent = (data.todayHours || 0) + ' ч';
        statCount.textContent = data.todayCount || 0;
        if (data.last) {
          lastLabel.textContent = 'Последнее — ' + data.last.ago;
          lastEntry.innerHTML = '';
          if (data.last.category) {
            const badge = document.createElement('span');
            badge.className = 'badge';
            badge.textContent = data.last.category;
            lastEntry.appendChild(badge);
          }
          const desc = document.createElement('span');
          desc.className = 'last-desc';
          desc.textContent = data.last.description || '';
          lastEntry.appendChild(desc);
          if (data.last.hours) {
            const hrs = document.createElement('span');
            hrs.className = 'last-hours';
            hrs.textContent = data.last.hours + ' ч';
            lastEntry.appendChild(hrs);
          }
        }
      })
      .catch(() => { /* тихо игнорируем — не мешаем вводу, если статистика не подгрузилась */ });
  }
  loadStats();

  /* ---------- Сохранение ---------- */
  function resetSave() { saveBtn.disabled = false; saveBtn.textContent = 'Записать'; }

  saveBtn.addEventListener('click', () => {
    const v = txt.value.trim();
    if (!v) { statusEl.style.color = '#e24b4a'; statusEl.textContent = 'Поле пустое'; return; }
    if (API_URL.indexOf('ВСТАВЬ_СЮДА') !== -1) {
      statusEl.style.color = '#e24b4a';
      statusEl.textContent = 'Сначала настрой API_URL в коде страницы';
      return;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = 'Сохраняю…';
    statusEl.style.color = 'var(--text-secondary)';
    statusEl.textContent = '';

    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // важно: text/plain, иначе браузер шлёт preflight-запрос, который Apps Script не поддерживает
      body: JSON.stringify({ text: v })
    })
      .then((r) => r.json())
      .then((data) => {
        if (data.ok) {
          statusEl.style.color = '#639922';
          statusEl.textContent = data.message || 'Записано ✓';
          txt.value = '';
          loadStats();
        } else {
          statusEl.style.color = '#e24b4a';
          statusEl.textContent = 'Ошибка: ' + (data.error || 'не удалось');
        }
        resetSave();
        try { txt.focus(); } catch (e) {}
      })
      .catch(() => {
        statusEl.style.color = '#e24b4a';
        statusEl.textContent = 'Нет связи с сервером';
        resetSave();
      });
  });

  /* ---------- Защита от случайного закрытия кнопкой "назад" ---------- */
  history.pushState({ guard: true }, '', location.href);
  window.addEventListener('popstate', function onPop() {
    const hasUnsaved = txt.value.trim().length > 0;
    if (hasUnsaved) {
      const wantsLeave = confirm('Текст не сохранён. Закрыть без сохранения?');
      if (wantsLeave) {
        window.removeEventListener('popstate', onPop);
        history.back();
      } else {
        history.pushState({ guard: true }, '', location.href);
      }
    }
  });

  /* ---------- Service worker (для мгновенной загрузки при следующих открытиях) ---------- */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
